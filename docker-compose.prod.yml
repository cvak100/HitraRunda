name: hitrarunda

x-frontend: &frontend
  build:
    context: ./frontend
    dockerfile: Dockerfile.prod
  image: hitrarunda-frontend:prod
  depends_on:
    backend:
      condition: service_healthy
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hitrarunda}
      POSTGRES_USER: ${POSTGRES_USER:-hitrarunda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?nastavi POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hitrarunda} -d ${POSTGRES_DB:-hitrarunda}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    image: hitrarunda-backend:prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hitrarunda}
      POSTGRES_USER: ${POSTGRES_USER:-hitrarunda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?nastavi POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      APP_URL: ${APP_URL:?nastavi APP_URL (http://… ali https://…)}
      APP_VERSION: ${APP_VERSION:-}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?nastavi DJANGO_SECRET_KEY}
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      DJANGO_COOKIE_SECURE: ${DJANGO_COOKIE_SECURE:-}
      DJANGO_COLLECTSTATIC: "1"
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-}
    command: ["daphne", "-b", "0.0.0.0", "-p", "8000", "config.asgi:application"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # HTTP: aplikacija neposredno na APP_PORT (privzeto 5008).
  frontend:
    <<: *frontend
    profiles: ["http"]
    ports:
      - "${APP_PORT:-5008}:80"

  # HTTPS: isti image, brez host porta — Caddy na 80/443.
  frontend_tls:
    <<: *frontend
    profiles: ["https"]

  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-}
      TLS_EMAIL: ${TLS_EMAIL:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend_tls
    restart: unless-stopped

  # Dnevni pg_dump (ohrani 7 dni). Vklopi: docker compose -f docker-compose.prod.yml --env-file .env --profile backup up -d db-backup
  db-backup:
    image: postgres:16-alpine
    profiles: ["backup"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hitrarunda}
      POSTGRES_USER: ${POSTGRES_USER:-hitrarunda}
      PGPASSWORD: ${POSTGRES_PASSWORD:?nastavi POSTGRES_PASSWORD}
      PGHOST: db
    volumes:
      - pgbackups:/backups
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        while true; do
          stamp=$$(date +%F)
          echo "[backup] $$stamp"
          pg_dump -U "$$POSTGRES_USER" "$$POSTGRES_DB" | gzip > "/backups/hitrarunda-$$stamp.sql.gz"
          ls -1t /backups/hitrarunda-*.sql.gz 2>/dev/null | tail -n +8 | xargs -r rm -f
          sleep 86400
        done

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  pgbackups:
