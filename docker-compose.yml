name: hitrarunda

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hitrarunda}
      POSTGRES_USER: ${POSTGRES_USER:-hitrarunda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hitrarunda}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hitrarunda} -d ${POSTGRES_DB:-hitrarunda}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hitrarunda}
      POSTGRES_USER: ${POSTGRES_USER:-hitrarunda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hitrarunda}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-not-for-production}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      # DEBUG=1 → ALLOWED_HOSTS=* + CSRF za LAN (telefon). Sicer dodaj IP v .env.
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:5008,http://127.0.0.1:5008}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-admin@hitrarunda.local}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-admin12345}
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  frontend:
    build: ./frontend
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "${APP_PORT:-5008}:5008"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  frontend_node_modules:
